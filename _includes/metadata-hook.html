<script>
  (() => {
    const storageKey = 'portfolio-theme';
    const savedMode = localStorage.getItem(storageKey);
    const initialMode = savedMode === 'dark' || savedMode === 'light' ? savedMode : 'light';

    document.documentElement.setAttribute('data-mode', initialMode);
    sessionStorage.setItem('mode', initialMode);

    const updateToggle = (button, mode) => {
      const darkMode = mode === 'dark';
      const icon = button.querySelector('i');

      button.setAttribute('aria-label', darkMode ? '라이트 모드로 전환' : '다크 모드로 전환');
      button.setAttribute('title', darkMode ? '라이트 모드' : '다크 모드');
      button.setAttribute('aria-pressed', String(darkMode));
      icon.className = darkMode ? 'fas fa-sun' : 'fas fa-moon';
    };

    document.addEventListener('DOMContentLoaded', () => {
      const button = document.createElement('button');
      const icon = document.createElement('i');

      button.type = 'button';
      button.id = 'portfolio-theme-toggle';
      button.appendChild(icon);
      document.body.appendChild(button);
      updateToggle(button, initialMode);

      button.addEventListener('click', () => {
        const currentMode = document.documentElement.getAttribute('data-mode');
        const nextMode = currentMode === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-mode', nextMode);
        localStorage.setItem(storageKey, nextMode);
        sessionStorage.setItem('mode', nextMode);
        updateToggle(button, nextMode);
        window.postMessage({ id: 'theme-mode' }, '*');
      });
    });
  })();
</script>
